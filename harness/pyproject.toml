[project]
name = "harness"
version = "0.1.0"
description = "A judgment harness: structured task contracts to model seats, reasoning separated from verdicts, validation before acceptance, and provenance on every call."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]
