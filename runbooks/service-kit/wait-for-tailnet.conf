# Wait for the overlay address before binding it.
#
# Every unit in this deployment binds its node's overlay IP by deliberate
# posture (one posture fleet-wide, zero exceptions). At boot the user manager
# can start these before the overlay daemon has assigned that address, and
# binding an address that does not exist yet fails instantly: docker reports
# "cannot assign requested address", uvicorn reports Errno 99.
#
# This happens on every boot and heals every time, which is why nobody sees it:
# Restart=on-failure catches it on counter 1. A boot that loses several units at
# once is the reason to care. A keeper that fails to come back takes the whole
# node dark to the rest of the fabric, and that is the safety net doing the
# design's job rather than a design.
#
# Ordering cannot fix this. The overlay daemon is a SYSTEM unit and these are
# USER units, so After=<daemon>.service in a user unit orders against a user
# unit by that name, finds none, and is silently a no-op. Polling crosses the
# namespace boundary; ordering does not.
#
# No "$" anywhere on purpose: systemd expands $VAR on Exec lines before the
# shell ever sees it, so seq/counter forms get mangled. The bound comes from
# timeout(1) instead, and a timeout exits non-zero into the same
# Restart=on-failure path that is carrying this today.
#
# Costs about 4ms when the address is already up. Revert by deleting this
# file and running: systemctl --user daemon-reload
[Service]
ExecStartPre=/usr/bin/timeout 120 /usr/bin/bash -c 'until /usr/sbin/ip -4 -o addr show dev tailscale0 2>/dev/null | grep -q "inet "; do sleep 1; done'
