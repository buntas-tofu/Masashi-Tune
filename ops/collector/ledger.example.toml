# Storage ledger, layer 2 of three: an EXAMPLE, authored for the public repo.
#
# Every concern and node below is synthetic. Copy this file to ledger.toml and
# fill in your own concerns: what each storage area is FOR, which node holds
# HEAD, which nodes mirror it, and whether living on one node is a decision or
# an accident.
#
# The reconciler (reconcile.py, layer 3) checks this declaration against what
# the collector actually found on disk every run and reports the disagreements.
#
# This file declares INTENTION. The collector derives fact from disk. When they
# disagree the disk wins and the disagreement is the finding, per the
# collector's design rule 1: a declared path that does not exist is a finding,
# not a silent absence. So do not edit this file to make a warning go away.
# Edit it when the intention actually changes, and move the bytes when the bytes
# should move.
#
# Keys per concern:
#   head             the node that holds the authoritative copy
#   mirror           nodes that hold an intentional second copy
#   root             storage root this concern lives under, when not the
#                    primary root. Home-relative (~/place), resolved per node.
#   room             the directory name under that root, when it differs from
#                    the concern name
#   single_home_ok   true means one node is the right answer and the reconciler
#                    should stop asking. Use it sparingly: it is the difference
#                    between "we decided" and "we forgot", and the whole value
#                    of this file is keeping those apart.
#   note             the reason, in prose. This is the part a future reader
#                    needs and the part a machine cannot derive.

[concern.example-models]
head = "example-a"
mirror = ["example-b"]
note = """Re-fetchable model weights. Loss costs bandwidth rather than history,
which is why this is the one concern where a single copy would not be a
catastrophe and why it is declared with a mirror anyway."""

[concern.example-archive]
head = "example-a"
mirror = ["example-b", "example-c"]
note = """The long-lived document archive. Irreplaceable, so it is mirrored
twice and the mirror list is the contract: a node that drops out of this list
is a disk failure away from being the only copy."""

[concern.example-venvs]
head = "example-b"
single_home_ok = true
note = """Node-specific by construction and correctly NOT migrated. A virtual
environment is not relocatable; its interpreter paths bake the absolute
location. This entry exists to stop the reconciler flagging correct behavior
forever, which is exactly the "we decided" case."""

[concern.example-scratch]
head = "example-a"
single_home_ok = true
note = """Rebuildable scratch space. Declared single-home on purpose so the
unbacked class does not fire on material nobody would restore."""

[concern.example-reports]
root = "~/reports"
head = "example-c"
note = """Derived reports declared against a non-primary root. Only declared
rooms outside the primary root are watched, so this concern is the whole of
that root's coverage. It is a report shelf: the source is elsewhere, so a
single readable copy is a deliberate choice."""
